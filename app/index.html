<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="theme-color" content="#7C5CFF" />
<meta name="description" content="Division Adventure — a colorful, playful app that teaches division from Grade 1 to Grade 6." />
<title>Division Adventure</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>➗</text></svg>" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="paper-bg" aria-hidden="true">
    <span class="doodle doodle-1">✏️</span>
    <span class="doodle doodle-2">📏</span>
    <span class="doodle doodle-3">➗</span>
    <span class="doodle doodle-4">🍎</span>
    <span class="doodle doodle-5">⭐</span>
    <span class="doodle doodle-6">📐</span>
  </div>

  <header class="topbar" id="topbar"></header>

  <main id="main" class="screen-host" tabindex="-1"></main>

  <canvas id="confetti-canvas" aria-hidden="true"></canvas>
  <div id="toast-host" class="toast-host" role="status" aria-live="polite"></div>
  <div id="modal-host" class="modal-host" hidden></div>

  <script src="js/util.js"></script>
  <script src="js/state.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/visual.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/session.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/challenge.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
